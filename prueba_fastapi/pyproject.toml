[project]
name = "prueba-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.46",
]

[project.scripts]
prueba-fastapi = "prueba_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
